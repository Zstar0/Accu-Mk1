server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads (HPLC CSVs, chromatograms)
    client_max_body_size 50M;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Cache static assets aggressively (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE endpoints — must NOT be buffered
    # (api/flags/stream keeps its double /api: the flags router carries its
    # own /api prefix, so stripping one /api here still leaves the right path)
    location ~ ^/api/(api/flags/stream|hplc/(seed-peptides|import-standards|rebuild-standards|peptides/[^/]+/resync)/stream|sample-preps/scan-hplc)$ {
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://accu-mk1-backend:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Disable all buffering for SSE
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;

        # Tell downstream proxies not to buffer
        add_header X-Accel-Buffering no;
    }

    # Proxy API requests to the backend container
    location /api/ {
        # Strip /api prefix: /api/health → /health
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://accu-mk1-backend:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
    }

    # Never let browsers cache the SPA shell: hashed asset names change every
    # deploy, so a heuristically-cached index.html points at deleted bundles
    # (blank page until a hard refresh). no-cache = revalidate every load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Read-only document embed shell (DocumentEmbed.tsx), framed by Paperclip.
    # This is the ONLY framable page; the policy is inherited by the sandboxed
    # document frame, so it also bounds what document content can load: no
    # remote scripts/images/connect, no forms, and frame-src 'none' blocks the
    # document frame from navigating itself to a remote URL. The Paperclip
    # origin(s) come from MK1_EMBED_FRAME_ANCESTORS (nginx:alpine envsubst at
    # container start, exact origins, space-separated, never '*'). The Dockerfile
    # ENV default is 'none'. If the variable is truly unset, envsubst leaves the
    # placeholder and nginx refuses to start (unknown variable): closed, but the
    # whole frontend is down, not just framing.
    location = /embed.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors ${MK1_EMBED_FRAME_ANCESTORS}";
    }

    # Phone capture page — tiny, must never go stale across deploys
    location /m/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
