name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Red on master (896 eslint errors, mostly under src/test): reported, not blocking.
      - run: npm run lint
        continue-on-error: true
      # 3 ast-grep errors on master: reported, not blocking.
      - run: npm run ast:lint
        continue-on-error: true
      # Prettier is red on master: reported, not blocking.
      - run: npm run format:check
        continue-on-error: true
      # Vitest has known pre-existing failures on master (see PR description); reported, not blocking.
      - run: npm run test:run
        continue-on-error: true
